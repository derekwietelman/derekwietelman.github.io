# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://derekwietelman.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

# Papers live in content/publications/ but are published under /research/,
# e.g. content/publications/bbr/ -> /research/bbr/.
permalinks:
  page:
    publications: /research/:contentbasename/

cascade:
  - target:
      path: /slides/**
      kind: page
    outputs: [HTML, present]

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
# Hugo writes a small redirect page at each address listed under a page's `aliases:`.
disableAliases: false
outputs:
  home: [HTML]
  section: [HTML]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  # An image on its own line becomes a captioned figure (theme's image hook).
  # Don't also wrap it in a paragraph, which isn't valid HTML around a figure.
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep

ignoreLogs:
  - pub-legacy-/research/bbr/
  - pub-legacy-/research/trading/
